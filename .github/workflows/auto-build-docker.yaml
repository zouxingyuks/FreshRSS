name: Build and push Docker images
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cloning extensions from plugin.json
        run: |
          # Create extension directory (if it does not exist)
          mkdir -p ./extensions

          # Read the plugin.json file and extract the git repository link.
          PLUGIN_REPOS=$(grep -o '"repository"\s*:\s*"[^"]*"' .git-hub/plugin.json | grep -o 'https://[^"]*')

          # Iterate through all found repository links and clone the
          if [ -n "$PLUGIN_REPOS" ]; then
            echo "find these extensions repo:"
            echo "$PLUGIN_REPOS"

            for REPO in $PLUGIN_REPOS; do
              echo "clone repo: $REPO"
              cd ./extensions
              git clone $REPO
              cd ..
              echo "clone repo: $REPO"
            done
          else
            echo "no found repo link in plugin.json "
          fi

      - name: Login In Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setting the QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setting Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Docker/Dockerfile-Newest
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/FreshRSS:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/FreshRSS:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/FreshRSS:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/FreshRSS:buildcache,mode=max
